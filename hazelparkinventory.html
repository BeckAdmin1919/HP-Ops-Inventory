}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{ background:var(--accent-soft); }
h1,h2,h3,.display{
  font-family:"Libre Franklin", ui-sans-serif, system-ui, sans-serif;
  font-weight:800;
  letter-spacing:-0.01em;
  text-wrap:balance;
  margin:0;
}
.mono, .qty-input, .num{ font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }
a{ color:var(--focus); }
button{ font-family:inherit; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1080px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.brand{ display:flex; flex-direction:column; gap:2px; margin-right:auto; }
.brand .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); font-weight:600; }
.brand h1{ font-size:19px; }
.tabs{ display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px; }
.tab-btn{
  border:none; background:transparent; color:var(--ink-muted);
  padding:8px 14px; border-radius:7px; font-size:13.5px; font-weight:600;
  cursor:pointer; white-space:nowrap;
}
.tab-btn.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
.tab-btn:hover:not(.active){ color:var(--ink); }

.wrap{ max-width:1080px; margin:0 auto; padding:22px 20px 120px; }
.page-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.page-head h2{ font-size:24px; }
.page-head p{ color:var(--ink-muted); margin:4px 0 0; font-size:14px; max-width:60ch; }

.stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:20px; }
.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
}
.stat .num{ font-size:26px; font-weight:600; display:block; }
.stat .label{ font-size:12px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
.stat.crit .num{ color:var(--critical); }
.stat.ok .num{ color:var(--good); }

.toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.search{
  flex:1; min-width:180px; padding:9px 12px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:14px;
}
.chip-toggle{
  display:flex; gap:6px; flex-wrap:wrap;
}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-muted);
  padding:6px 11px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer;
}
.chip.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }

.cat-group{ margin-bottom:22px; }
.cat-title{
  font-size:12px; text-transform:uppercase; letter-spacing:.07em; font-weight:700;
  color:var(--ink-muted); padding:0 2px 8px; border-bottom:1px solid var(--line); margin-bottom:10px;
}
.item-card{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; margin-bottom:8px; box-shadow:var(--shadow);
}
.item-top{ display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.item-name{ font-size:15px; font-weight:600; line-height:1.3; }
.item-sub{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; }
.badges{ display:flex; gap:6px; flex-shrink:0; }
.badge{
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; white-space:nowrap;
  text-transform:uppercase; letter-spacing:.03em;
}
.badge.crit-highest{ background:var(--critical-soft); color:var(--critical); }

.badge.crit-low{ background:var(--neutral-soft); color:var(--ink-muted); }
.badge.needs{ background:var(--critical-soft); color:var(--critical); }
.badge.reactive{ background:var(--warn-soft); color:var(--warn); }
.badge.review{ background:var(--warn-soft); color:var(--warn); }

.count-row{ display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
.stepper{ display:flex; align-items:center; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.stepper button{
  border:none; background:var(--surface-2); color:var(--ink); width:32px; height:34px; font-size:16px; cursor:pointer;
}
.stepper button:hover{ background:var(--accent-soft); color:var(--accent); }
.qty-input{
  width:74px; text-align:center; border:none; border-left:1px solid var(--line); border-right:1px solid var(--line);

}
.qty-unit{ font-size:12.5px; color:var(--ink-muted); }
.par-note{ font-size:12px; color:var(--ink-muted); margin-left:auto; text-align:right; }
.last-counted{ font-size:11.5px; color:var(--ink-muted); margin-top:6px; }
.dirty-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; margin-right:6px; }

.savebar{
  position:sticky; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
  padding:12px 20px; display:flex; justify-content:center;
}
.savebar-inner{ max-width:1080px; width:100%; display:flex; align-items:center; gap:14px; }
.save-status{ font-size:13px; color:var(--ink-muted); flex:1; }
.btn{

}
.btn-primary{ background:var(--accent); color:var(--accent-ink); }
.btn-primary:disabled{ opacity:.4; cursor:default; }
.btn-ghost{ background:var(--surface-2); color:var(--ink); }
.btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:7px; }

.order-section{ margin-bottom:26px; }

function fmtQty(n){
  if(n===null || n===undefined) return '—';
  const r = Math.round(n*100)/100;
  return (r % 1 === 0) ? String(r) : String(r);
}
function round2(n){ return Math.round(n*100)/100; }

function orderQtyFor(it){
  if(it.threshold===null || it.target===null || it.threshold===undefined || it.target===undefined) return null;
  if(it.currentQty===null || it.currentQty===undefined) return null;
  if(it.currentQty < it.threshold){
    return Math.max(0, round2(it.target - it.currentQty));
  }
  return 0;
}
function needsOrder(it){
  const q = orderQtyFor(it);
  return q !== null && q > 0;
}
function isTracked(it){
  return it.threshold !== null && it.threshold !== undefined && it.target !== null && it.target !== undefined;
}

function groupByCategory(items){
  const groups = {};
  items.forEach(it=>{
    const key = it.category || "Uncategorized";
    if(!groups[key]) groups[key]=[];
    groups[key].push(it);
  });
  const orderedKeys = Object.keys(groups).sort((a,b)=>{
    const ai = CATEGORY_ORDER.indexOf(a), bi = CATEGORY_ORDER.indexOf(b);
    return (ai===-1?999:ai) - (bi===-1?999:bi);
  });
  return orderedKeys.map(k=>({cat:k, items:groups[k]}));
}

function critBadgeClass(c){
  const s=(c||'').toLowerCase();
  if(s==='highest') return 'crit-highest';
  if(s==='high') return 'crit-high';
  if(s==='medium') return 'crit-medium';
  return 'crit-low';
}

function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Apply saved db state onto the in-memory catalog
function applyDbState(data){
  if(data.counts && Array.isArray(data.counts)){
    data.counts.forEach(c=>{
      const item = state.items.find(i=>i.id===c.id);
      if(item){
        item.currentQty = (c.currentQty !== undefined) ? c.currentQty : null;
        item.lastCounted = c.lastCounted || null;
      }
    });
  }
  if(data.history && Array.isArray(data.history)) state.history = data.history;
  if(data.notes && Array.isArray(data.notes)) state.notes = data.notes;
  if(data.savedAt) state.savedAt = data.savedAt;
}

  if(groups.length===0) html += `<div class="empty">No items match "${escapeHtml(searchQ)}".</div>`;

// ---------- STATUS TAB ----------
function renderStatus(){
  const tracked = state.items.filter(isTracked);
  const asNeeded = state.items.filter(it=>!isTracked(it));
  const allItems = [...tracked, ...asNeeded];

  function statusBadge(it){
    if(it.currentQty===null||it.currentQty===undefined) return `<span class="status-badge none">Not counted</span>`;
    if(it.threshold===null||it.threshold===undefined) return `<span class="status-badge none">${fmtQty(it.currentQty)}</span>`;
    if(it.currentQty <= it.threshold) return `<span class="status-badge low">⚠ ${fmtQty(it.currentQty)} — Order now</span>`;
    const warn = it.threshold * 1.5;
    if(it.currentQty <= warn) return `<span class="status-badge warn">↓ ${fmtQty(it.currentQty)} — Getting low</span>`;
    return `<span class="status-badge ok">✓ ${fmtQty(it.currentQty)}</span>`;
  }

  function orderCell(it){
    if(!isTracked(it)||it.currentQty===null||it.currentQty===undefined) return '<span style="color:var(--ink-muted)">—</span>';
    if(!needsOrder(it)) return '<span style="color:var(--ink-muted)">—</span>';
    return `<span class="status-order">Order ${fmtQty(orderQtyFor(it))} ${escapeHtml(it.increment)}</span>`;
  }

  function sourceCell(it){
    const vt = it.vendorType;
    if(vt==='morr') return 'Morr Inc. (Eric)';
    if(vt==='internal') return 'Plant Nerd (Amy)';
    if(it.howToOrder) return escapeHtml(it.howToOrder.length>40 ? it.howToOrder.slice(0,38)+'…' : it.howToOrder);
    return '—';
  }

  function tsCell(it){
    if(!it.lastCounted) return '<span class="status-ts">Never counted</span>';
    const d = new Date(it.lastCounted);
    const date = d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const time = d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    return `<span class="status-ts">${date} ${time}</span>`;
  }

  const belowPar = tracked.filter(needsOrder).length;
  const uncounted = tracked.filter(it=>it.currentQty===null||it.currentQty===undefined).length;

  let html = `
  <div class="page-head">
    <div><h2>Inventory Status</h2>
    <p>Current counts vs. par levels. Last saved: ${state.savedAt ? new Date(state.savedAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : 'unknown'}.</p></div>
  </div>
  <div class="stat-row">
    <div class="stat crit"><span class="num mono">${belowPar}</span><span class="label">Below par — order now</span></div>
    <div class="stat"><span class="num mono">${uncounted}</span><span class="label">Not yet counted</span></div>
    <div class="stat"><span class="num mono">${tracked.length - belowPar - uncounted}</span><span class="label">Stocked OK</span></div>
  </div>
  <div class="table-wrap">
    <table class="status-table">
      <thead><tr>
        <th>Item</th>
        <th>Status / Count</th>
        <th>Par</th>
        <th>To Order</th>
        <th>Source</th>
        <th>Last Counted</th>
      </tr></thead>
      <tbody>`;

  allItems.forEach(it=>{
    html += `<tr>
      <td>
        <div class="status-item-name">${escapeHtml(it.item)}</div>
        <div class="status-item-sub">${escapeHtml(it.increment)}${it.itemNumber?' · #'+escapeHtml(it.itemNumber):''}</div>
      </td>
      <td>${statusBadge(it)}</td>
      <td class="mono" style="white-space:nowrap">${it.threshold!==null&&it.threshold!==undefined?fmtQty(it.threshold):'—'}</td>
      <td>${orderCell(it)}</td>
      <td class="status-source">${sourceCell(it)}</td>
      <td>${tsCell(it)}</td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
  return html;
}

function renderHistory(){

  if(!state.history.length){
    html += `<div class="empty">Nothing logged yet — history fills in as counts are saved, orders sent, and notes added.</div>`;
    return html;
  }
  const events = state.history.slice().reverse();
  events.forEach(ev=>{
    const d = new Date(ev.ts);
    if(ev.type==='count'){
      html += `<div class="hist-item">
        <div class="hist-top"><span class="hist-type count">Count</span><span class="hist-date">${d.toLocaleString()}</span></div>
        <div class="hist-detail">${ev.entries.length} item${ev.entries.length===1?'':'s'} updated
          <details><summary>View items</summary><ul class="hist-list">
            ${ev.entries.map(e=>`<li>${escapeHtml(e.item)}: ${fmtQty(e.qty)}</li>`).join('')}
          </ul></details>
        </div>
      </div>`;
    } else if(ev.type==='order'){
      html += `<div class="hist-item">
        <div class="hist-top"><span class="hist-type order">Order sent — ${ev.vendorLabel}</span><span class="hist-date">${d.toLocaleString()}</span></div>
        <div class="hist-detail">${ev.entries.length} item${ev.entries.length===1?'':'s'}
          <details><summary>View items</summary><ul class="hist-list">
            ${ev.entries.map(e=>`<li>${escapeHtml(e.item)}: ×${fmtQty(e.qty)}</li>`).join('')}
          </ul></details>
        </div>
      </div>`;
    } else if(ev.type==='note'){
      html += `<div class="hist-item">
        <div class="hist-top"><span class="hist-type count">Note</span><span class="hist-date">${d.toLocaleString()}</span></div>
        <div class="hist-detail">${escapeHtml(ev.text)}</div>
      </div>`;
    }
  });
  return html;
}

// ---------- SETUP TAB ----------
function renderSetup(){
  const flagged = state.items.filter(it=>it.confidence==='low'||it.confidence==='medium');
  let html = `
  <div class="page-head">
    <div>
      <h2>Item Setup</h2>
      <p>Reorder point and target quantity drive the Order List math, both in the item's buying increment. ${flagged.length} item${flagged.length===1?'':'s'} below were guessed from messy notes in your original sheet and need a look.</p>
    </div>
  </div>
  <div class="setup-row head">
    <div>Item</div><div>Reorder at</div><div>Buy up to</div><div>Criticality</div><div>How to order</div><div>Order link</div>
  </div>`;
  const allCats = Array.from(new Set([...CATEGORY_ORDER, ...state.items.map(it=>it.category||'')])).filter(Boolean);
  state.items.forEach(it=>{
    const flag = it.confidence==='low' || it.confidence==='medium';
    html += `<div class="setup-row">
      <div>
        <div style="font-weight:600;">${escapeHtml(it.item)} ${flag?'<span class="badge review">Review</span>':''}</div>
        <input class="cat-select" style="background:var(--surface-2); color:var(--ink-muted); font-weight:500;" type="text" value="${escapeHtml(it.increment)}" placeholder="buying increment, e.g. 50 lb bag" onchange="App.setField('${it.id}','increment',this.value)">
        <select class="cat-select" onchange="App.setField('${it.id}','category',this.value)">
          ${allCats.map(c=>`<option value="${escapeHtml(c)}" ${it.category===c?'selected':''}>${escapeHtml(catLabel(c))}</option>`).join('')}
        </select>
        ${it.reviewNote ? `<div class="review-note">${escapeHtml(it.reviewNote)}</div>` : ''}
      </div>
      <div><input type="number" step="0.01" value="${it.threshold===null?'':it.threshold}" placeholder="not tracked" onchange="App.setField('${it.id}','threshold',this.value)"></div>
      <div><input type="number" step="0.01" value="${it.target===null?'':it.target}" placeholder="not tracked" onchange="App.setField('${it.id}','target',this.value)"></div>
      <div>
        <select onchange="App.setField('${it.id}','criticality',this.value)">
          ${['','Low','Medium','High','HIGHEST'].map(c=>`<option value="${c}" ${it.criticality===c?'selected':''}>${c||'—'}</option>`).join('')}
        </select>
      </div>
      <div><input type="text" value="${escapeHtml(it.howToOrder)}" onchange="App.setField('${it.id}','howToOrder',this.value)"></div>
      <div><input type="url" placeholder="https://…" value="${escapeHtml(it.link||'')}" onchange="App.setField('${it.id}','link',this.value)"></div>
    </div>`;
  });
  return html;
}

function render(){
  const app = document.getElementById('app');
  let body = '';
  if(activeTab==='count') body = renderCount();
  else if(activeTab==='status') body = renderStatus();
  else if(activeTab==='order') body = renderOrder();
  else if(activeTab==='history') body = renderHistory();
  else if(activeTab==='setup') body = renderSetup();

  const saveDisabled = !dirty;
  app.innerHTML = `
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="eyebrow">Hazel Park · Cultivation</span>
          <h1>Inventory &amp; Ordering</h1>
        </div>
        <div class="tabs">
          <button class="tab-btn ${activeTab==='count'?'active':''}" onclick="App.setTab('count')">Count</button>
          <button class="tab-btn ${activeTab==='status'?'active':''}" onclick="App.setTab('status')">Status</button>
          <button class="tab-btn ${activeTab==='order'?'active':''}" onclick="App.setTab('order')">Order List</button>
          <button class="tab-btn ${activeTab==='history'?'active':''}" onclick="App.setTab('history')">History</button>
          <button class="tab-btn ${activeTab==='setup'?'active':''}" onclick="App.setTab('setup')">Item Setup</button>
        </div>
      </div>
    </div>
    <div class="wrap">
      ${body}
    </div>
    <div class="savebar">
      <div class="savebar-inner">
        <span class="save-status">${saveMsg || (dirty ? 'Unsaved changes' : (dbReady ? 'All changes saved' : 'Connecting…'))}</span>
        <button class="btn btn-primary" ${saveDisabled?'disabled':''} onclick="App.save()">Save${dirty?' Count':''}</button>
      </div>
    </div>
  `;
}

// ---------- STATE MUTATIONS ----------
function findItem(id){ return state.items.find(i=>i.id===id); }

const App = {
  setTab(t){ activeTab=t; searchQ=''; render(); },
  setSearch(v){ searchQ=v; render(); },
  setQty(id, v){
    const it = findItem(id);
    if(!it) return;
    it.currentQty = v===''? null : parseFloat(v);
    it.dirty = true;
    dirty = true;
    saveMsg='';
    render();
  },
  stepQty(id, delta){
    const it = findItem(id);
    if(!it) return;
    const cur = (it.currentQty===null||it.currentQty===undefined) ? 0 : it.currentQty;
    it.currentQty = Math.max(0, round2(cur+delta));
    it.dirty = true;
    dirty = true;
    render();
  },
  setField(id, field, v){
    const it = findItem(id);
    if(!it) return;
    if(field==='threshold' || field==='target'){
      it[field] = v===''? null : parseFloat(v);
    } else if(field==='link'){
      it[field] = v.trim()===''? null : v.trim();
    } else {
      it[field] = v;
    }
    dirty = true;
    render();
  },
  copyMorr(){
    const ta = document.getElementById('morr-list');
    ta.select();
    navigator.clipboard && navigator.clipboard.writeText(ta.value).catch(()=>{});
    try{ document.execCommand('copy'); }catch(e){}
    const m = document.getElementById('copy-msg');
    if(m){ m.textContent='Copied.'; setTimeout(()=>{ if(m) m.textContent=''; },2500); }
  },
  logOrderSent(kind){
    const items = kind==='morr'
      ? state.items.filter(it=>isTracked(it) && it.vendorType==='morr' && needsOrder(it))
      : state.items.filter(it=>isTracked(it) && it.vendorType!=='morr' && it.vendorType!=='internal' && needsOrder(it));
    if(!items.length) return;
    state.history.push({
      ts: new Date().toISOString(),
      type: 'order',
      vendorLabel: kind==='morr' ? 'Morr, Inc.' : 'Other vendors',
      entries: items.map(it=>({item:it.item, qty:orderQtyFor(it)}))
    });
    doSave(false);
  },
  addNote(){
    const input = document.getElementById('note-input');
    if(!input) return;
    const text = input.value.trim();
    if(!text) return;
    const note = { id: 'n' + Date.now() + Math.random().toString(36).slice(2,7), text, ts: new Date().toISOString() };
    state.notes = state.notes || [];
    state.notes.push(note);
    state.history.push({ ts: note.ts, type: 'note', text: note.text });
    doSave(false);
  },
  dismissNote(id){
    state.notes = (state.notes||[]).filter(n=>n.id!==id);
    doSave(false);
  },
  async save(){ await doSave(true); }
};

// ---------- SUPABASE SAVE ----------
async function doSave(isCount){
  if(!sbClient){
    saveMsg = 'Not connected — reload and try again.';
    render();
    return;
  }
  if(isCount){
    const changed = state.items.filter(it=>it.dirty);
    if(changed.length){
      const now = new Date().toISOString();
      changed.forEach(it=>{ it.lastCounted = now; delete it.dirty; });
      state.history.push({
        ts: now,
        type: 'count',
        entries: changed.map(it=>({item:it.item, qty:it.currentQty}))
      });
    }
    dirty = false;
  }
  saveMsg = 'Saving…';
  render();
  try{
    const counts = state.items.map(it=>({
      id: it.id,
      currentQty: (it.currentQty !== null && it.currentQty !== undefined) ? it.currentQty : null,
      lastCounted: it.lastCounted || null
    }));
    const payload = {
      counts,
      history: state.history || [],
      notes: state.notes || [],
      savedAt: new Date().toISOString()
    };
    const { error } = await sbClient
      .from('inventory_state')
      .upsert({ id: 'main', data: payload, saved_at: new Date().toISOString() });
    if(error) throw error;
    saveMsg = 'Saved!';
    setTimeout(()=>{ saveMsg=''; render(); }, 2000);
  } catch(err){
    saveMsg = 'Could not save — try again.';
    console.error(err);
  }
  render();
}

// ---------- SUPABASE INIT ----------
async function initDb(){
  try{
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Load saved state
    try{
      const { data, error } = await sbClient
        .from('inventory_state')
        .select('data')
        .eq('id', 'main')
        .maybeSingle();
      if(!error && data && data.data) applyDbState(data.data);
    } catch(e){
      // Start fresh if load fails
    }

    dbReady = true;
    render();

  } catch(e){
    saveMsg = 'Could not connect to database.';
    render();
  }
}

window.App = App;
render();
initDb();

})();
</script>
